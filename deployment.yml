File .yml là một tệp văn bản sử dụng ngôn ngữ tuần tự hóa dữ liệu YAML (Yet Another Markup Language), thường được dùng để tạo các tệp cấu hình. YAML được thiết kế để dễ đọc và hiểu cho cả người dùng và các ngôn ngữ lập trình, và có thể hoạt động với nhiều ngôn ngữ lập trình khác nhau như Python, Java, và PHP.